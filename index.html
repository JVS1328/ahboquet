<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for allie 🌷</title>
<meta name="theme-color" content="#070d0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070d0a; --panel: #0c1511; --panel2: #101c16; --line: #1b2e24; --text: #d8e8dd; --muted: #6b8a79;
    --green: #4ade80; --lime: #a3e635; --pink: #ff7eb6; --yellow: #fde68a; --blue: #93c5fd; --orange: #fdba74;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.6;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(74, 222, 128, .14), transparent 60%),
      radial-gradient(700px 500px at 100% 10%, rgba(163, 230, 53, .08), transparent 60%),
      radial-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: rgba(74, 222, 128, .3); }
  button { font: inherit; color: inherit; }

  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 16px;
            background: rgba(7, 13, 10, .82); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; } .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .path { color: var(--muted); white-space: nowrap; } .path b { color: var(--green); font-weight: 600; }
  nav { margin-left: auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 8px; white-space: nowrap; font-size: 13px; }
  nav a:hover { color: var(--green); background: var(--panel2); }

  main { max-width: 1040px; margin: 0 auto; padding: 22px 16px 40px; display: grid; gap: 22px; }
  .hero h1 { margin: 6px 0 0; font-size: clamp(30px, 7vw, 56px); line-height: 1.05; font-weight: 800; letter-spacing: -.03em; }
  .hero h1 .g { color: var(--green); text-shadow: 0 0 30px rgba(74, 222, 128, .45); }
  .hero p { margin: 10px 0 0; color: var(--muted); }

  .win { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 64px;
         box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(74, 222, 128, .05); }
  .wbar { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; background: var(--panel2); border-bottom: 1px solid var(--line); }
  .wbar.mac { justify-content: center; position: relative; }
  .wbar.mac .dots { position: absolute; left: 14px; }
  .wtitle { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 110px); }
  .wtitle b { color: var(--text); font-weight: 600; }
  .tab { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border-bottom: 2px solid var(--green); font-size: 13px; }
  .tab .ic { color: var(--green); }
  .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ascii canvases */
  .bq { position: relative; height: clamp(360px, min(74vh, 118vw), 680px); background: #050907; }
  .bq canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: pointer; outline: none;
                              filter: drop-shadow(0 0 2.5px rgba(255, 255, 255, .22)); }
  .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel2); }
  #bqline { color: #fff; min-height: 1.6em; }
  #bqline::after { content: '_'; color: var(--green); animation: blink 1s steps(1) infinite; }
  .for { color: var(--pink); white-space: nowrap; font-size: 12px; }

  @keyframes blink { 50% { opacity: 0; } }

  .status { display: flex; gap: 16px; align-items: center; padding: 6px 16px; background: #14532d; color: #dcfce7; font-size: 12px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .status::-webkit-scrollbar { display: none; }
  .status .r { margin-left: auto; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="path">~/<b>allie</b></div>
</header>

<main>
  <div class="hero">
    <h1>hi <span class="g">allie</span> 🌿</h1>
    <p># I made you a bouquet. tap the flowers 🌷</p>
  </div>

  <section class="win" id="bouquet">
    <div class="wbar mac"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="wtitle">~/allie — <b>python bouquet3d.py</b> — <span id="bqsize"></span></div></div>
    <div class="bq"><canvas id="bq" tabindex="0" aria-label="A spinning 3D bouquet drawn in text characters. Tap a flower, or press Enter, to make it bloom. Drag sideways to spin it."></canvas></div>
    <div class="foot"><span id="bqline" aria-live="polite"></span><span class="for">for allie ♥</span></div>
  </section>
</main>

<footer class="status">
  <span>⎇ main</span><span>● bouquet3d.py</span><span>✓ 0 problems</span><span class="r">🐍 python 3.12</span><span>♥ loved: ∞</span>
</footer>

<script>
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pickOne = a => a[Math.random() * a.length | 0];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const norm = v => { const l = Math.hypot(...v) || 1; return v.map(x => x / l); };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';

const cssCache = new Map();
function css(r, g, b) {
  r = Math.max(0, Math.min(255, r)) & ~7; g = Math.max(0, Math.min(255, g)) & ~7; b = Math.max(0, Math.min(255, b)) & ~7;
  const k = (r << 16) | (g << 8) | b;
  let s = cssCache.get(k); if (!s) cssCache.set(k, s = `rgb(${r},${g},${b})`);
  return s;
}

/* A canvas that draws a grid of monospace characters, sized to its box. */
function charCanvas(cv, fsFor, onResize) {
  const ctx = cv.getContext('2d');
  const g = { ctx, W: 0, H: 0, cw: 1, ch: 1, cols: 0, rows: 0, font: '' };
  new ResizeObserver(() => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    if (!r.width) return;
    g.W = r.width; g.H = r.height; cv.width = g.W * dpr; cv.height = g.H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fs = fsFor(g.W, g.H);
    g.cw = fs * 0.62; g.ch = fs * 1.08; g.cols = Math.ceil(g.W / g.cw); g.rows = Math.ceil(g.H / g.ch);
    g.font = `700 ${fs}px ${MONO}`; g.big = `700 ${Math.round(fs * 2)}px ${MONO}`;
    ctx.font = g.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    onResize();
  }).observe(cv);
  g.text = (c, r, s, col) => { ctx.fillStyle = col; ctx.fillText(s, c * g.cw + g.cw / 2, r * g.ch + g.ch / 2); };
  return g;
}

function onScreen(el, cb) { new IntersectionObserver(([e]) => cb(e.isIntersecting)).observe(el); }

/* ================= bouquet3d.py — a spinning 3D bouquet in ASCII ================= */
(() => {
  const cv = $('bq'), lineEl = $('bqline');
  const heads = [
    { p: [-0.62, 1.12, 0.05], o: ['#9b4dff', '#ff7ad9'], c: '#ffc93c', k: 6, s: 1 },
    { p: [0, 1.32, -0.12],    o: ['#e8e6f5', '#ffffff'], c: '#ff3b5c', k: 5, s: 1.05 },
    { p: [0.62, 1.16, 0.02],  o: ['#d00024', '#ff4d4d'], c: '#ffd23f', k: 5, s: 1 },
    { p: [-1.08, 0.66, 0.1],  o: ['#ff9f1c', '#ffe94d'], c: '#ff6a00', k: 6, s: .95 },
    { p: [1.08, 0.74, 0],     o: ['#ffc300', '#fff59d'], c: '#ff7b00', k: 5, s: .95 },
    { p: [0.5, 0.48, 0.45],   o: ['#ff2e8a', '#ffb3d9'], c: '#ffffff', k: 6, s: .85 },
    { p: [-0.48, 0.5, 0.45],  o: ['#4d7cff', '#b8d0ff'], c: '#ffe066', k: 5, s: .85 }
  ];

  // point cloud: x y z, nx ny nz, r g b, kind (char ramp), owner (flower index or -1)
  const G = [0, -0.55, 0], ST = 11, pts = [];
  const add = (p, n, c, kind, owner = -1) => { n = norm(n); pts.push(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2], kind, owner); };

  heads.forEach((h, i) => {
    const d = norm([h.p[0] - G[0], h.p[1] - G[1] + 1.2, h.p[2] - G[2]]);
    const e1 = norm(cross(d, [0, 0, 1])), e2 = cross(d, e1);
    // a cup of petals around axis d, top edge cut into k petal tips
    const layer = (R, H, k, off, lift, ca, cb, step) => {
      for (let u = 0; u <= 1; u += 0.025) for (let t = 0; t < TAU; t += step) {
        const lobe = Math.abs(Math.cos(k * (t + off) / 2));
        if (u > 0.66 + 0.34 * Math.sqrt(lobe)) continue;
        const w = 1 + 0.12 * lobe, a = u * Math.PI * 0.6;
        const r = R * w * (0.18 + 0.82 * Math.sin(a) + 0.25 * u ** 3);
        const dr = R * w * (0.82 * Math.PI * 0.6 * Math.cos(a) + 0.75 * u * u);
        const c = Math.cos(t), s = Math.sin(t), hgt = lift + u * H;
        const rad = [0, 1, 2].map(j => e1[j] * c + e2[j] * s);
        add([0, 1, 2].map(j => h.p[j] + d[j] * hgt + rad[j] * r), [0, 1, 2].map(j => rad[j] * H - d[j] * dr), mix(ca, cb, u), 0, i);
      }
    };
    const core = hex(h.c);
    layer(0.34 * h.s, 0.5 * h.s, h.k, 0, 0, hex(h.o[0]), hex(h.o[1]), 0.045);
    layer(0.2 * h.s, 0.44 * h.s, h.k - 1, 0.6, 0.05 * h.s, mix(core, [0, 0, 0], 0.2), core, 0.06);
  });

  const ring = (p, col) => { for (let a = 0; a < TAU; a += TAU / 4) add([p[0] + Math.cos(a) * 0.014, p[1], p[2] + Math.sin(a) * 0.014], [Math.cos(a), 0, Math.sin(a)], col, 2); };
  heads.forEach((h, i) => {
    const a = i * 2.4, ox = Math.cos(a) * 0.04, oz = Math.sin(a) * 0.04;
    const B = h.p, E = [ox, G[1], oz], C = [B[0] * 0.3, (B[1] + G[1]) / 2, B[2] * 0.3], F = [ox * 3.5, -1.5, oz * 3.5];
    const col = mix(hex('#2f7d32'), hex('#8be36b'), (i % 4) / 3);
    for (let t = 0; t <= 1; t += 0.006) ring([0, 1, 2].map(j => (1 - t) ** 2 * B[j] + 2 * t * (1 - t) * C[j] + t * t * E[j]), col);
    for (let t = 0; t <= 1; t += 0.01) ring(mix(E, F, t), col);
  });

  [[0.3, 1], [1.3, 0.9], [2.4, 1.05], [3.4, 0.9], [4.5, 1.05], [5.5, 0.95], [0.85, 0.8], [3.95, 0.8]].forEach(([phi, len]) => {
    const ca = Math.cos(phi), sa = Math.sin(phi);
    for (let s = 0; s <= 1; s += 0.012) {
      const w = 0.2 * Math.sin(Math.PI * s) ** 0.8;
      const cx = ca * s * len, cy = -0.2 + len * (1.5 * s - 0.9 * s * s), cz = sa * s * len;
      const up = len * (1.5 - 1.8 * s), n = [-up * ca, len, -up * sa];
      const col = mix(hex('#1b7a3a'), hex('#b5f23d'), s);
      for (let t = -1; t <= 1.001; t += 0.1) add([cx - sa * t * w, cy - 0.2 * t * t * w, cz + ca * t * w], n, col, 0);
    }
  });

  const paper = v => mix(hex('#8d8aa8'), hex('#f6f2ff'), v);
  const wrap = (v, t, kind) => {
    if (v > 1 - 0.12 * Math.abs(Math.sin(3 * t))) return;
    const r = (0.09 + 0.7 * v) * (1 + 0.04 * Math.sin(9 * t));
    add([r * Math.cos(t), -0.6 + 0.97 * v, r * Math.sin(t)], [Math.cos(t), -0.72, Math.sin(t)], paper(v), kind);
  };
  for (let v = 0.04; v <= 1; v += 0.12) for (let t = 0; t < TAU; t += 0.022) wrap(v, t, 1);
  for (let k = 0; k < 14; k++) for (let v = 0; v <= 1; v += 0.012) wrap(v, k * TAU / 14 + 0.1, 4);

  const pink = hex('#ff4fa3'), pink2 = hex('#ffa6d5');
  for (let a = 0; a < TAU; a += 0.12) for (let b = 0; b < TAU; b += 0.35) {
    const R = 0.11 + 0.035 * Math.cos(b);
    add([R * Math.cos(a), -0.62 + 0.035 * Math.sin(b), R * Math.sin(a)], [Math.cos(b) * Math.cos(a), Math.sin(b), Math.cos(b) * Math.sin(a)], pink, 3);
  }
  [-1, 1].forEach(sg => {
    for (let a = 0; a < TAU; a += 0.05) for (let b = 0; b < TAU; b += 0.6) {
      const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), n = [sg * ca * cb, sa * cb, sb];
      add([sg * (0.15 + ca * 0.13) + n[0] * 0.022, -0.58 + sa * 0.075 + n[1] * 0.022, 0.15 + n[2] * 0.022], n, mix(pink, pink2, (sa + 1) / 2), 3);
    }
    for (let t = 0; t <= 1; t += 0.015) for (let w = -1; w <= 1; w += 0.5)
      add([sg * (0.03 + 0.16 * t) + w * 0.025, -0.64 - 0.32 * t, 0.15 - 0.03 * t], [0, 0, 1], pink, 3);
  });

  const D = new Float32Array(pts), N = D.length / ST;
  const RAMPS = [':-=+*o#%@@', '.-~==', '.:;!|', '.oO@@', '.:!||'];
  const L = norm([-0.45, 0.55, 0.7]), PITCH = 0.14, CAM = 7, YC = 0.15;
  let zb, ib, lb, stars = [], S = 1, yaw = 0, visible = false, last = performance.now(), t0 = null;
  const scale = new Float32Array(heads.length).fill(1), pulseAt = heads.map(() => -1e9), particles = [];

  const g = charCanvas(cv, (W, H) => Math.max(7, Math.min(12, Math.min(W, H) / 58)), () => {
    const n = g.cols * g.rows;
    zb = new Float32Array(n); ib = new Int32Array(n); lb = new Float32Array(n);
    S = Math.min(g.H * 0.8 / 3.5, g.W * 0.96 / 3.6);
    stars = Array.from({ length: Math.round(n / 80) }, () => ({ c: Math.random() * g.cols | 0, r: Math.random() * g.rows | 0, ph: rnd(0, TAU), sp: rnd(0.5, 2.5), ch: pickOne('.·*+') }));
    $('bqsize').textContent = `${g.cols}×${g.rows}`;
  });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    requestAnimationFrame(frame);
    if (!visible || !zb) return;
    if (t0 === null) t0 = now;
    const { ctx, cols, rows, cw, ch } = g;
    if (!drag.on && !reduce) yaw += dt * 0.3;
    const reveal = reduce ? 99 : -1.6 + (now - t0) / 1000 * 1.4;   // grows in from the bottom
    heads.forEach((_, i) => { const t = (now - pulseAt[i]) / 650; scale[i] = t >= 0 && t < 1 ? 1 + 0.45 * Math.sin(Math.PI * t) : 1; });

    zb.fill(-1e9); ib.fill(-1);
    const cY = Math.cos(yaw), sY = Math.sin(yaw), cP = Math.cos(PITCH), sP = Math.sin(PITCH), ox = g.W / 2, oy = g.H * 0.47;
    for (let i = 0; i < N; i++) {
      const o = i * ST; let y = D[o + 1];
      if (y > reveal) continue;
      let x = D[o], z = D[o + 2];
      const own = D[o + 10];
      if (own >= 0 && scale[own] !== 1) { const p = heads[own].p, s = scale[own]; x = p[0] + (x - p[0]) * s; y = p[1] + (y - p[1]) * s; z = p[2] + (z - p[2]) * s; }
      y -= YC;
      const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
      const y2 = y * cP - z1 * sP, z2 = y * sP + z1 * cP;
      const f = S * CAM / (CAM - z2);
      const col = Math.floor((ox + x1 * f) / cw), row = Math.floor((oy - y2 * f) / ch);
      if (col < 0 || row < 0 || col >= cols || row >= rows) continue;
      const k = row * cols + col;
      if (z2 <= zb[k]) continue;
      const nx = D[o + 3], ny = D[o + 4], nz = D[o + 5];
      const n1z = -nx * sY + nz * cY, n2z = ny * sP + n1z * cP;
      let dot = (nx * cY + nz * sY) * L[0] + (ny * cP - n1z * sP) * L[1] + n2z * L[2];
      if (n2z < 0) dot = -dot;   // two-sided lighting
      zb[k] = z2; ib[k] = i; lb[k] = 0.25 + 0.75 * Math.max(0, dot);
    }

    ctx.clearRect(0, 0, g.W, g.H);
    ctx.font = g.font;
    const ts = now / 1000;
    for (const s of stars) {
      if (ib[s.r * cols + s.c] >= 0) continue;
      const a = 0.15 + 0.5 * Math.abs(Math.sin(ts * s.sp + s.ph));
      g.text(s.c, s.r, s.ch, css(200 * a, 215 * a, 255 * a));
    }
    for (let k = 0; k < ib.length; k++) {
      const i = ib[k]; if (i < 0) continue;
      const o = i * ST, lum = lb[k], ramp = RAMPS[D[o + 9]], b = 0.55 + 0.6 * lum;
      g.text(k % cols, k / cols | 0, ramp[Math.min(ramp.length - 1, Math.sqrt(lum) * ramp.length | 0)], css(D[o + 6] * b, D[o + 7] * b, D[o + 8] * b));
    }
    ctx.font = g.big;
    for (let j = particles.length - 1; j >= 0; j--) {
      const p = particles[j];
      if ((p.life -= dt) <= 0) { particles.splice(j, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt;
      ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.fillStyle = p.c; ctx.fillText(p.ch, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  let typeTimer;
  function say(text) {
    clearInterval(typeTimer); let n = 0;
    typeTimer = setInterval(() => { lineEl.textContent = '> ' + text.slice(0, ++n); if (n >= text.length) clearInterval(typeTimer); }, 26);
  }
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: rnd(-80, 80), vy: rnd(-180, -60), life: rnd(1, 1.8), ch: '♥♥*+'[i % 4], c: ['#ff4fa3', '#ff8fc7', '#ffd23f', '#ffffff'][i % 4] });
  }
  function pick(i, x, y) { pulseAt[i] = performance.now(); burst(x, y, 10); }

  function tap(x, y) {
    const c0 = Math.floor(x / g.cw), r0 = Math.floor(y / g.ch);
    let best = -1, bestD = 1e9;
    for (let r = r0 - 3; r <= r0 + 3; r++) for (let c = c0 - 3; c <= c0 + 3; c++) {
      if (r < 0 || c < 0 || r >= g.rows || c >= g.cols) continue;
      const i = ib[r * g.cols + c]; if (i < 0) continue;
      const own = D[i * ST + 10], d = (r - r0) ** 2 + (c - c0) ** 2;
      if (own >= 0 && d < bestD) { bestD = d; best = own; }
    }
    best >= 0 ? pick(best, x, y) : burst(x, y, 3);
  }

  const drag = { on: false, x: 0, moved: 0 };
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { drag.on = true; drag.x = e.clientX; drag.moved = 0; });
  cv.addEventListener('pointermove', e => { if (!drag.on) return; const dx = e.clientX - drag.x; drag.x = e.clientX; drag.moved += Math.abs(dx); yaw += dx * 0.008; });
  cv.addEventListener('pointerup', e => { drag.on = false; if (drag.moved < 10) tap(...pos(e)); });
  cv.addEventListener('pointercancel', () => { drag.on = false; });
  cv.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); pick(Math.random() * heads.length | 0, g.W / 2, g.H * 0.35);
  });

  onScreen(cv, v => visible = v);
  setTimeout(() => say('tap a flower ♥'), reduce ? 0 : 2400);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
